name: Release

# Builds ONE self-contained, statically-linked binary per platform, collects
# them into a single npm package, and publishes. Triggered by a git tag (v*).
#
# Result: `require("duckdb-bun-shim")` returns the path to the right prebuilt
# binary for the current platform/arch. No libduckdb alongside, no rpath.
#
# Required secret: NPM_TOKEN  (npm access token with publish rights)

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

# softprops/action-gh-release needs contents:write to create the release and
# upload assets. (New repos default to read-only GITHUB_TOKEN.)
permissions:
  contents: write

env:
  # Pin the v2 development build used by this prerelease. Update this pair
  # together when cutting the next alpha; do not build from a moving branch.
  DUCKDB_SOURCE_REF: 1582849bf9e35de3fa3c330935ede5ce598e28a3
  DUCKDB_DEV_VERSION: v2.0.0-dev1

jobs:
  build:
    name: Build ${{ matrix.triple }}
    runs-on: ${{ matrix.runner }}
    # The v2 alpha publishes the 4 Unix core platforms. Windows is deferred to
    # a follow-up with a dedicated source-build toolchain.
    continue-on-error: ${{ matrix.experimental || false }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Both mac arches built on macos-14 (arm64). x64 is cross-compiled
          # via `clang -arch x86_64` — avoids the deprecated macos-13 Intel
          # runner, which queues indefinitely.
          - { runner: macos-14,     triple: darwin-arm64, duckdb_arch: arm64 }
          - { runner: macos-14,     triple: darwin-x64,   shim_triple: darwin-x64, duckdb_arch: x86_64 }
          - { runner: ubuntu-24.04, triple: linux-x64 }
          - { runner: ubuntu-24.04-arm, triple: linux-arm64 }
          # Windows is intentionally deferred for the v2 alpha: the preview
          # source build needs a dedicated MSVC/MinGW configuration.

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Checkout pinned DuckDB v2 source
        if: runner.os != 'Windows'
        uses: actions/checkout@v4
        with:
          repository: duckdb/duckdb
          ref: ${{ env.DUCKDB_SOURCE_REF }}
          path: duckdb-v2
          fetch-depth: 1

      # The build script auto-detects (os, arch) from the runner; SHIM_TRIPLE
      # forces the output target (cross-compile).
      - name: Build (unix)
        if: runner.os != 'Windows'
        env:
          SHIM_TRIPLE: ${{ matrix.shim_triple }}
          SHIM_DUCKDB_SOURCE_DIR: ${{ github.workspace }}/duckdb-v2
          DUCKDB_BUILD_DIR: ${{ runner.temp }}/duckdb-build-${{ matrix.triple }}
          DUCKDB_CMAKE_OSX_ARCHITECTURES: ${{ matrix.duckdb_arch }}
        run: SHIM_DUCKDB_VERSION="$DUCKDB_DEV_VERSION" bash scripts/build-static.sh

      - name: Smoke test (unix)
        if: runner.os != 'Windows'
        run: |
          bun -e '
          const { Database } = require("bun:sqlite");
          const path = require("node:path");
          const file = path.join(process.cwd(),
            "prebuilt", `${process.platform}-${process.arch.replace("x64","x64")}.${process.platform==="darwin"?"dylib":process.platform==="win32"?"dll":"so"}`);
          Database.setCustomSQLite(file);
          const db = new Database(":memory:");
          console.log("OK:", db.query("SELECT 1+1 AS s").get());
          '

      - name: DuckDB v2 compatibility tests
        if: runner.os != 'Windows'
        run: DUCKDB_SHIM_LIBRARY="$(find prebuilt -maxdepth 1 -type f | head -n 1)" bun run test:v2

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: prebuilt-${{ matrix.triple }}
          path: prebuilt/
          if-no-files-found: error

  publish:
    name: Publish to npm
    needs: build
    runs-on: ubuntu-24.04
    # Only publish on tagged releases, after all 4 core Unix platforms succeed.
    if: always() && needs.build.result == 'success' && startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4

      - name: Collect all prebuilt binaries
        uses: actions/download-artifact@v4
        with:
          pattern: prebuilt-*
          path: prebuilt
          merge-multiple: true

      - name: Verify core platforms present (windows optional)
        run: |
          ls -la prebuilt/
          for f in darwin-arm64.dylib darwin-x64.dylib linux-x64.so linux-arm64.so; do
            test -f "prebuilt/$f" || { echo "MISSING prebuilt/$f"; exit 1; }
          done
          [ -f "prebuilt/win32-x64.dll" ] && echo "windows: present" || echo "windows: skipped (experimental)"

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v4
        with:
          registry-url: https://registry.npmjs.org

      # Publish runs first. It fails until NPM_TOKEN is configured — that's
      # expected. `if: always()` on the release step below means the GitHub
      # release assets still get attached regardless.
      - name: Publish to npm
        continue-on-error: true
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Attach binaries to GitHub release
        if: always() && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          # Glob uploads whatever was built (skips missing windows binary)
          files: |
            prebuilt/*
